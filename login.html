<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en PARENTYX">
    <title>Iniciar sesión - PARENTYX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <main class="auth-layout">
        <section class="auth-card" aria-labelledby="login-title">
            <a href="index.html" class="auth-logo-link" aria-label="Volver al inicio">
                <img class="auth-logo" src="images/promis.png" alt="PARENTYX - Ruta de crianza saludable">
            </a>

            <div class="auth-heading">
                <span class="eyebrow">PARENTYX</span>
                <h1 id="login-title">Inicia sesión</h1>
                <p>Accede a tu espacio de crianza saludable.</p>
            </div>

            <form id="login-form" class="auth-form">
                <label for="login-email">Correo electrónico</label>
                <input id="login-email" name="email" type="email" autocomplete="email" required>

                <label for="login-password">Contraseña</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required>

                <button type="submit" class="btn btn-primary">Iniciar sesión</button>
                <p id="login-message" class="auth-message" role="status" aria-live="polite"></p>
            </form>

            <p class="auth-footer-text">¿Aún no tienes una cuenta? <a href="index.html#registro">Regístrate</a></p>
            <a class="auth-back-link" href="index.html">Volver al inicio</a>
        </section>
    </main>

    <script type="module" src="js/login.js"></script>
</body>
</html>
